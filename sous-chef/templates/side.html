<title>Sous-chef</title>
<style>
:root{
  --bg:#e6ecdb;--bg2:#d7e1c6;--fg:#1e2a1a;--muted:#66755c;--card:#fbfdf6;--line:#d2dcc2;
  --accent:#2e6b3e;--accent2:#1e5230;--accent-fg:#fff;--accent-soft:#dcead4;
  --ok:#2e6b3e;--ok2:#1e5230;--ok-soft:#deecd6;--warn:#c4401d;--warn2:#a12f10;--warn-soft:#f6e3d9;
  --soft:#dde6cf;--chip:#d3dec1;
  --grad-accent:linear-gradient(135deg,var(--accent),var(--accent2));
  --grad-ok:linear-gradient(135deg,var(--ok),var(--ok2));
  --grad-warn:linear-gradient(135deg,var(--warn),var(--warn2));
  --shadow:0 1px 2px rgba(40,70,35,.07),0 8px 24px rgba(40,70,35,.09);
  --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b12;--bg2:#1b2617;--fg:#e9f0e2;--muted:#93a389;--card:#1f2a1b;--line:#33412d;
  --accent:#8cc98c;--accent2:#5fa666;--accent-fg:#10200f;--accent-soft:#25361f;
  --ok:#8cc98c;--ok2:#5fa666;--ok-soft:#22331e;--warn:#f07a50;--warn2:#d65527;--warn-soft:#3c2418;
  --soft:#26321f;--chip:#31402a;
  --shadow:0 1px 2px rgba(0,0,0,.32),0 8px 24px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#141b12;--bg2:#1b2617;--fg:#e9f0e2;--muted:#93a389;--card:#1f2a1b;--line:#33412d;
  --accent:#8cc98c;--accent2:#5fa666;--accent-fg:#10200f;--accent-soft:#25361f;
  --ok:#8cc98c;--ok2:#5fa666;--ok-soft:#22331e;--warn:#f07a50;--warn2:#d65527;--warn-soft:#3c2418;
  --soft:#26321f;--chip:#31402a;
  --shadow:0 1px 2px rgba(0,0,0,.32),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 18px 10px}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
header .sub{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
header .sub .stag{background:var(--soft);color:var(--muted);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
header .sub .stag b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:700}
nav.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
nav.tabs button{flex:1;padding:13px 4px 11px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:15px;border-bottom:3px solid transparent;transition:color .12s}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;padding:14px 12px 96px}
.hidden{display:none !important}
button{cursor:pointer}
button.big{width:100%;padding:16px;border-radius:13px;border:0;background:var(--grad-accent);color:var(--accent-fg);font:inherit;font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(30,80,40,.28)}
button.big:active{filter:brightness(.94)}
button.ghost{background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;font-size:15px}
button.ghost:active{background:var(--chip)}
.note{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px}

/* ---- Indkoeb ---- */
.lukker{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in oklab,var(--warn) 30%,transparent);border-radius:13px;padding:11px 13px;margin-bottom:14px;font-size:14.5px;line-height:1.4}
.lukker .ic{font-size:16px;line-height:1.3;flex:none}
.pwrap{margin:0 2px 18px}
.pwrap .ptop{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);margin-bottom:7px}
.pwrap .ptop b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad-ok);border-radius:999px;transition:width .25s ease}
.afd{margin:0 0 20px}
.afd .ahead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.afd h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:800}
.afd .acount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.vare{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow)}
.vare .box{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:20px;color:#fff;margin-top:1px;transition:background .12s,border-color .12s}
.vare.koebt .box{background:var(--grad-ok);border-color:var(--ok)}
.vare.koebt .navn{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.vare.koebt{opacity:.72}
.vare .txt{flex:1;min-width:0}
.vare .navn{font-weight:650;font-size:16.5px;display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.vare .maengde{color:var(--fg);opacity:.8;font-weight:600}
.vare .vnote{color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.vare .har{border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:8px 11px;border-radius:10px;flex:none;align-self:center}
.harliste{margin-top:6px}
.harliste summary{cursor:pointer;color:var(--muted);padding:10px 4px;font-size:14px;font-weight:600;list-style:none}
.harliste summary::-webkit-details-marker{display:none}
.harliste summary::before{content:"▸ ";color:var(--muted)}
.harliste[open] summary::before{content:"▾ "}
.harliste .vare{opacity:.72}

/* ---- Madlavning ---- */
.strip{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.strip .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.strip .chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.strip .chip .ct{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.strip .chip.done{background:var(--grad-warn);border-color:var(--warn);color:#fff;animation:pulse 1s ease-in-out infinite}
.strip .chip.done .ct{color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.tidslinje{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.tidslinje summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;font-weight:700;color:var(--muted)}
.tidslinje summary::-webkit-details-marker{display:none}
.tidslinje summary b{color:var(--fg);font-variant-numeric:tabular-nums}
.tidslinje summary .tnext{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tl-raekke{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px;cursor:pointer}
.tl-raekke .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tl-raekke .ttitel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-raekke .tmark{flex:none;font-size:12px;font-weight:800;color:var(--muted)}
.tl-raekke.gjort{opacity:.55}
.tl-raekke.gjort .ttitel{text-decoration:line-through}
.tl-raekke.nu{background:var(--accent-soft)}
.tl-raekke.nu .tmark{color:var(--accent)}
.kort{background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 55%,var(--card)),var(--card) 130px);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.kort .top{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13.5px;font-weight:600}
.kort .ret{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:12px 0 2px}
.kort .ret .dot{width:9px;height:9px;border-radius:50%;flex:none}
.kort h2{margin:8px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.kort .handling{font-size:18px;line-height:1.4;margin:4px 0 14px}
.blok{border-radius:12px;padding:11px 13px;margin:11px 0;font-size:15px;line-height:1.4}
.blok b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-weight:800}
.blok.kende{background:var(--ok-soft);color:var(--fg)}
.blok.kende b{color:var(--ok)}
.blok.fejl{background:var(--warn-soft);color:var(--fg)}
.blok.fejl b{color:var(--warn)}
.ingr{background:var(--soft);border-radius:12px;padding:10px 13px;margin:11px 0}
.ingr b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:800;color:var(--muted)}
.ingr .irk{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:15.5px;cursor:pointer}
.ingr .irk .ibox{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.ingr .irk.brugt .ibox{background:var(--grad-ok);border-color:var(--ok)}
.ingr .irk.brugt span:last-child{text-decoration:line-through;color:var(--muted)}
.uddyb{margin:11px 0}
.uddyb summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;padding:4px 0}
.uddyb summary::-webkit-details-marker{display:none}
.uddyb summary::before{content:"▸ "}
.uddyb[open] summary::before{content:"▾ "}
.uddyb .utekst{color:var(--fg);opacity:.85;font-size:15px;line-height:1.45;padding:6px 0 2px;white-space:pre-line}
.timer{display:flex;align-items:center;gap:14px;margin:16px 0 6px}
.timer .tid{font-variant-numeric:tabular-nums;font-size:40px;font-weight:800;min-width:132px;letter-spacing:-.02em}
.timer .tid.done{color:var(--warn)}
.timer button{flex:1}
.knapper{display:flex;gap:9px;margin-top:14px}
.knapper button{flex:1}
.pager{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:linear-gradient(to top,var(--bg) 72%,transparent);border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.pager button{padding:15px 16px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:800;font-size:16px;flex:1;box-shadow:var(--shadow)}
.pager button:disabled{opacity:.4}
.pager button.done{background:var(--grad-ok);border-color:var(--ok);color:#fff}
.pager .pos{color:var(--muted);font-size:13.5px;font-weight:700;flex:none;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;box-shadow:var(--shadow)}
.toast.vis{opacity:1}
.estimat{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:12px;font-size:14.5px;box-shadow:var(--shadow)}
.estimat b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.vare .pris{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.kort .note{text-align:left;padding:4px 0 0}
.kopi{margin:0 0 16px}
.ov-menu{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.ov-ret{padding:12px 0;border-top:1px solid var(--line)}
.ov-ret:first-child{border-top:0}
.ov-ret .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ov-ret .rnavn{font-weight:750;font-size:17px}
.ov-ret .rkcal{color:var(--muted);font-size:13.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-ret .rtekst{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.35}
.ov-ret .rsund{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;color:var(--muted)}
.prikker{display:inline-flex;gap:3px}
.prikker i{width:9px;height:9px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.prikker i.paa{background:var(--ok);border-color:var(--ok)}
.baro{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.baro .btop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.baro .btitel{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.baro .bstor{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.baro .bmaal{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:9px 0 7px}
.baro .bmaal i{display:block;height:100%;border-radius:999px;background:var(--grad-ok);transition:width .25s ease}
.baro .bmaal i.over{background:var(--grad-warn)}
.baro .bnote{color:var(--muted);font-size:13.5px;line-height:1.4}
.baro .bnote b{color:var(--fg)}
.ov-tom{color:var(--muted);text-align:center;padding:26px 10px;font-size:14.5px}
.kort .tid-linje{color:var(--muted);font-size:13.5px;font-weight:600}
</style>

<div class="app">
  <header><h1 id="titel"></h1></header>
  <nav class="tabs">
    <button data-fane="overblik">Overblik</button>
    <button data-fane="indkoeb">Indkøb</button>
    <button data-fane="madlavning">Madlavning</button>
  </nav>
  <main>
    <section id="fane-overblik"></section>
    <section id="fane-indkoeb" class="hidden"></section>
    <section id="fane-madlavning" class="hidden"></section>
  </main>
  <div class="pager hidden" id="pager">
    <button id="forrige">‹ Forrige</button>
    <span class="pos" id="pos"></span>
    <button id="naeste">Næste ›</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script id="data" type="application/json">
__DATA__
</script>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const KEY = 'sous-chef:' + (DATA.id || 'side');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- lokal tilstand ----------
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ S = {}; }
S.koebt ||= {}; S.har ||= {}; S.timere ||= {}; S.ingr ||= {}; S.trin ||= 0; S.opdateret ||= 0;
const faner = ['overblik','indkoeb','madlavning'];
if (!faner.includes(S.fane)) S.fane = 'overblik';

const gemLokal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const gem = () => { S.opdateret = Date.now(); gemLokal(); push(); };

// ---------- delt lager (artifact-db) ----------
// Tilstanden bor i artifactens database (dokumentet planer/<plan-id>), så den overlever at
// siden lukkes og følger med på tværs af enheder. localStorage er kun en lokal cache.
// Fanen synkes ikke - den er pr. enhed.
let fjern = null, pushT = null, pushKoerer = false, pushVenter = false;
function push(){
  if (!fjern) return;
  clearTimeout(pushT);
  pushT = setTimeout(async () => {
    if (pushKoerer) { pushVenter = true; return; }
    pushKoerer = true;
    try { await fjern.set(JSON.parse(JSON.stringify(S))); } catch(e){}
    pushKoerer = false;
    if (pushVenter) { pushVenter = false; push(); }
  }, 600);
}
function anvendFjern(d){
  if (!d || typeof d.opdateret !== 'number' || d.opdateret <= S.opdateret) return;
  ['koebt','har','timere','ingr'].forEach(k => { S[k] = (d[k] && typeof d[k] === 'object') ? d[k] : {}; });
  if (typeof d.trin === 'number') S.trin = d.trin;
  S.opdateret = d.opdateret;
  gemLokal();
  renderAktiv();
}
(async () => {
  try {
    if (!(window.claude && window.claude.use)) return;
    const db = await window.claude.use('db');
    if (!db) return;
    fjern = db.doc('planer/' + (DATA.id || 'side'));
    const snap = await fjern.get();
    const rd = snap.exists ? (snap.data() || {}) : {};
    anvendFjern(rd);
    if (S.opdateret && (rd.opdateret || 0) < S.opdateret) push();
    fjern.onSnapshot(s => { if (s.exists && !s.metadata.hasPendingWrites) anvendFjern(s.data()); }, () => {});
  } catch(e){}
})();

const toastEl = document.getElementById('toast');
let toastT;
function toast(t){ toastEl.textContent=t; toastEl.classList.add('vis'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('vis'),1800); }

// ---------- header ----------
document.getElementById('titel').textContent = DATA.titel || 'Sous-chef';
document.title = DATA.titel || 'Sous-chef';

// ---------- faner ----------
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => visFane(b.dataset.fane));
function renderAktiv(){ if (S.fane==='madlavning') renderMadlavning(); else if (S.fane==='indkoeb') renderIndkoeb(); else renderOverblik(); }
function visFane(f){
  S.fane = f; gemLokal();
  faner.forEach(x => {
    document.getElementById('fane-'+x).classList.toggle('hidden', x!==f);
    document.querySelector('nav.tabs button[data-fane="'+x+'"]').classList.toggle('on', x===f);
  });
  document.getElementById('pager').classList.toggle('hidden', f!=='madlavning');
  renderAktiv();
  window.scrollTo(0,0);
}

// ret-farver: en stabil prik pr. ret, så man kan se på tværs af trin hvad der hører sammen
const RETFARVER=['#2e6b3e','#c4401d','#b8860b','#3b6ea5','#8a4fa3','#2a8c8c'];
const retFarve = navn => { let h=0; for (const c of String(navn||'')) h=(h*31+c.charCodeAt(0))>>>0; return RETFARVER[h%RETFARVER.length]; };

// ---------- OVERBLIK ----------
// Menu, kalorier, økonomi og sundhed. Kalorier og sundhed er mine skøn pr. ret og skrives i data.menu.
const kr = n => Math.round(n).toLocaleString('da-DK')+' kr';
function prikker(n){ let h='<span class="prikker">'; for (let i=1;i<=5;i++) h+='<i class="'+(i<=n?'paa':'')+'"></i>'; return h+'</span>'; }
const SUND_ORD = {1:'tung',2:'under middel',3:'middel',4:'sund',5:'meget sund'};
function renderOverblik(){
  const el = document.getElementById('fane-overblik');
  const menu = DATA.menu || [];
  const pers = DATA.personer || 0;
  const varer = (DATA.indkoeb||{afdelinger:[]}).afdelinger.flatMap(a=>a.varer);
  const maaltid = varer.filter(v=>v.maaltid!==false && typeof v.pris==='number');
  const total = maaltid.reduce((s,v)=>s+v.pris,0);
  let h = '';
  if (menu.length){
    h += '<div class="ov-menu">' + menu.map(r =>
      '<div class="ov-ret"><div class="rtop"><span class="rnavn">'+esc(r.ret)+'</span><span class="rkcal">~'+Math.round(r.kcal_pr_person)+' kcal</span></div>'
      + (r.beskrivelse?'<div class="rtekst">'+esc(r.beskrivelse)+'</div>':'')
      + '<div class="rsund">'+prikker(r.sundhed.score)+'<span>'+SUND_ORD[r.sundhed.score]+' · '+esc(r.sundhed.begrundelse)+'</span></div></div>').join('') + '</div>';
    const kcal = menu.reduce((s,r)=>s+r.kcal_pr_person,0);
    h += '<div class="baro"><div class="btop"><span class="btitel">Kalorier pr. person</span><span class="bstor">~'+Math.round(kcal)+'</span></div>'
      + '<div class="bnote">Samlet for hele måltidet. Et skøn ud fra mængderne, typisk ±20 %. Ikke en ernæringsberegning.</div></div>';
    const snit = menu.reduce((s,r)=>s+r.sundhed.score,0)/menu.length;
    h += '<div class="baro"><div class="btop"><span class="btitel">Sundhed</span><span class="bstor">'+snit.toFixed(1).replace('.',',')+' / 5</span></div>'
      + '<div class="bmaal"><i style="width:'+Math.round(snit/5*100)+'%"></i></div>'
      + '<div class="bnote">Snit af retterne. 5 er meget grønt, bælgfrugter og fuldkorn med lidt fedt og sukker. Vejledende, vurderet ret for ret.</div></div>';
  }
  if (total>0){
    const budget = DATA.budget_kr;
    const over = budget && total>budget;
    h += '<div class="baro"><div class="btop"><span class="btitel">Økonomi</span><span class="bstor">ca. '+kr(total)+'</span></div>'
      + (budget ? '<div class="bmaal"><i class="'+(over?'over':'')+'" style="width:'+Math.min(100,Math.round(total/budget*100))+'%"></i></div>' : '')
      + '<div class="bnote">'+(pers? '<b>ca. '+kr(total/pers)+' pr. person</b> for '+pers+'. ' : '')
      + (budget ? (over ? 'Over budgettet på '+kr(budget)+' med '+kr(total-budget)+'.' : 'Inden for budgettet på '+kr(budget)+'.') : 'Skøn ud fra danske supermarkedspriser.')
      + (maaltid.length<varer.filter(v=>typeof v.pris==='number').length ? ' Ikke-mad på listen er ikke talt med.' : '')
      + '</div></div>';
  }
  if (!menu.length && !(total>0)) h = '<p class="ov-tom">Overblikket kommer, når menuen er godkendt.</p>';
  el.innerHTML = h;
}

// ---------- INDKØB ----------
function renderIndkoeb(){
  const el = document.getElementById('fane-indkoeb');
  const I = DATA.indkoeb || {afdelinger:[]};
  const alle = I.afdelinger.flatMap(a=>a.varer);
  const aktive = alle.filter(v=>!S.har[v.id]);
  const koebt = aktive.filter(v=>S.koebt[v.id]).length;
  let h = '';
  if (I.butik_lukker) h += '<div class="lukker"><span class="ic">🕒</span><span>'+esc(I.butik_lukker)+'</span></div>';
  // prisestimat: summen af varer der stadig skal købes (har-varer koster ikke noget)
  const medPris = aktive.filter(v=>typeof v.pris==='number');
  if (medPris.length){
    const total = medPris.reduce((s,v)=>s+v.pris,0), iKurv = medPris.filter(v=>S.koebt[v.id]).reduce((s,v)=>s+v.pris,0);
    h += '<div class="estimat"><span>Ca. <b>'+Math.round(total)+' kr</b> at handle for (skøn)</span><span>'+Math.round(iKurv)+' kr i kurven</span></div>';
  }
  h += '<button class="big kopi" id="kopi">Kopiér listen</button>';
  h += '<div class="pwrap"><div class="ptop"><span><b>'+koebt+'</b> af '+aktive.length+' i kurven</span><span>'+(alle.length-aktive.length? (alle.length-aktive.length)+' har du i forvejen':'')+'</span></div><div class="pbar"><i style="width:'+(aktive.length? Math.round(100*koebt/aktive.length):0)+'%"></i></div></div>';
  I.afdelinger.forEach(a => {
    const varer = a.varer.filter(v=>!S.har[v.id]);
    if (!varer.length) return;
    h += '<div class="afd"><div class="ahead"><h2>'+esc(a.navn)+'</h2><span class="acount">'+varer.filter(v=>S.koebt[v.id]).length+'/'+varer.length+'</span></div>';
    varer.forEach(v => h += vareHtml(v,false));
    h += '</div>';
  });
  const harListe = alle.filter(v=>S.har[v.id]);
  if (harListe.length){
    h += '<details class="harliste"><summary>Har jeg i forvejen ('+harListe.length+') - tryk for at fortryde</summary>';
    harListe.forEach(v => h += vareHtml(v,true));
    h += '</details>';
  }
  el.innerHTML = h;
  document.getElementById('kopi').onclick = kopier;
  el.querySelectorAll('.vare').forEach(n => {
    const id = n.dataset.id;
    n.querySelector('.box').onclick = () => { S.koebt[id] = !S.koebt[id]; gem(); renderIndkoeb(); };
    n.querySelector('.txt').onclick = () => { S.koebt[id] = !S.koebt[id]; gem(); renderIndkoeb(); };
    n.querySelector('.har').onclick = e => {
      e.stopPropagation();
      if (S.har[id]) { delete S.har[id]; toast('Tilbage på listen'); }
      else { S.har[id] = true; toast('Fjernet - fortryd nederst'); }
      gem(); renderIndkoeb();
    };
  });
}
// kort tekst til sms, delt op som butikken: samlet skøn først, så en sektion med emoji pr. afdeling
// med de varer der stadig mangler (ikke købt, ikke "har det"). Afdelingerne står i butiksrækkefølge.
const AFD_EMOJI = [[/frugt|grønt|groent/,'🥦'],[/frost|dybfrost/,'🧊'],[/køl|koel|mejeri|ost/,'🧀'],[/kød|koed|fisk|pålæg/,'🥩'],
  [/brød|broed|bager/,'🍞'],[/kolonial|tørvare|toervare|konserves/,'🥫'],[/drik|vin|øl/,'🥤'],
  [/husholdning|hygiejne|rengøring|andet|dyr/,'🧻']];
const afdEmoji = navn => { const n = String(navn).toLowerCase(); for (const [re,e] of AFD_EMOJI) if (re.test(n)) return e; return '🛒'; };
function listeTekst(){
  const I = DATA.indkoeb || {afdelinger:[]};
  const kort = t => String(t).replace(/\s*\(.*?\)/g,'');
  const afd = I.afdelinger.map(a => ({navn:a.navn, varer:a.varer.filter(v=>!S.har[v.id] && !S.koebt[v.id])})).filter(a=>a.varer.length);
  const varer = afd.flatMap(a=>a.varer);
  const medPris = varer.filter(v=>typeof v.pris==='number');
  const total = medPris.length===varer.length && varer.length ? Math.round(medPris.reduce((s,v)=>s+v.pris,0)) : null;
  const sektioner = afd.map(a => afdEmoji(a.navn)+' '+a.navn+'\n'+a.varer.map(v => '- '+kort(v.navn)+(v.maengde? ' '+kort(v.maengde) : '')).join('\n'));
  return (total!==null ? 'Indkøb, ca. '+total+' kr' : 'Indkøb') + '\n\n' + sektioner.join('\n\n');
}
async function kopier(){
  const tekst = listeTekst();
  try { await navigator.clipboard.writeText(tekst); toast('Listen er kopieret'); return; } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = tekst; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, tekst.length);
    const ok = document.execCommand('copy'); document.body.removeChild(ta);
    toast(ok ? 'Listen er kopieret' : 'Kunne ikke kopiere');
  } catch(e){ toast('Kunne ikke kopiere'); }
}
function vareHtml(v, iHar){
  return '<div class="vare'+(S.koebt[v.id]&&!iHar?' koebt':'')+'" data-id="'+esc(v.id)+'">'
    + '<div class="box">'+(S.koebt[v.id]&&!iHar?'✓':'')+'</div>'
    + '<div class="txt"><div class="navn">'+esc(v.navn)+(v.maengde?' <span class="maengde">· '+esc(v.maengde)+'</span>':'')+(typeof v.pris==='number'?' <span class="pris">~'+Math.round(v.pris)+' kr</span>':'')+'</div>'
    + (v.note?'<div class="vnote">'+esc(v.note)+'</div>':'') + '</div>'
    + '<button class="har">'+(iHar?'Tilbage':'Har det')+'</button></div>';
}

// ---------- MADLAVNING ----------
const trin = DATA.trin || [];
let tlAaben = false;
function timerMin(m){ const t=Math.floor(m/60), r=m%60; return t? (t+' t'+(r?' '+r+' min':'')) : (r+' min'); }
function fmt(ms){
  const neg = ms<0; ms = Math.abs(ms);
  const s = Math.round(ms/1000), mm = Math.floor(s/60), ss = s%60;
  return (neg?'-':'')+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function renderMadlavning(){
  const el = document.getElementById('fane-madlavning');
  if (!trin.length){ el.innerHTML = '<p class="note">Ingen trin endnu - de kommer når planen er skrevet.</p>'; return; }
  // åben-tilstand læses fra DOM, ikke fra toggle-events - de kommer asynkront og kan være bagud
  const gammelTl = document.getElementById('tidslinje');
  if (gammelTl) tlAaben = gammelTl.open;
  S.trin = Math.max(0, Math.min(S.trin, trin.length-1));
  const t = trin[S.trin];
  let h = '<div class="strip" id="status"></div>';
  // tidsestimat: aktiv tid = sum af trin[].aktiv_min; samlet + note kommer fra DATA.estimat
  const aktiv = trin.reduce((s,x)=>s+(x.aktiv_min||0),0), E = DATA.estimat||{};
  if (aktiv || E.samlet_min || E.note){
    const dele = [];
    if (aktiv) dele.push('<b>'+timerMin(aktiv)+'</b> ved gryderne (skøn)');
    if (E.samlet_min) dele.push(timerMin(E.samlet_min)+' fra start til bord');
    if (E.note) dele.push(esc(E.note));
    h += '<div class="estimat">'+dele.map(d=>'<span>'+d+'</span>').join('')+'</div>';
  }
  // trinliste: alle trin med status - fold ud, hop direkte til et trin
  const naeste = trin[S.trin+1];
  h += '<details class="tidslinje" id="tidslinje"'+(tlAaben?' open':'')+'>';
  h += '<summary><span>Trin <b>'+(S.trin+1)+'</b> af '+trin.length+'</span><span class="tnext">'+(naeste? 'næste: '+esc(naeste.titel) : 'sidste trin')+'</span></summary>';
  trin.forEach((x,i) => {
    h += '<div class="tl-raekke'+(i<S.trin?' gjort':i===S.trin?' nu':'')+'" data-i="'+i+'">'
      + '<span class="dot" style="background:'+retFarve(x.ret)+'"></span>'
      + '<span class="ttitel">'+esc(x.titel)+'</span>'
      + '<span class="tmark">'+(S.timere[x.id]?'⏱ ':'')+(i<S.trin?'✓':i===S.trin?'▶':'')+'</span></div>';
  });
  h += '</details>';
  h += '<div class="kort" id="kort">';
  const tidDele = [];
  if (t.aktiv_min) tidDele.push('~'+t.aktiv_min+' min i hænderne');
  if (t.timer_min) tidDele.push(timerMin(t.timer_min)+' ventetid');
  h += '<div class="top"><span class="tid-linje">'+tidDele.join(' · ')+'</span></div>';
  h += '<h2>'+esc(t.titel)+'</h2>';
  if (t.ret) h += '<span class="ret"><span class="dot" style="background:'+retFarve(t.ret)+'"></span>'+esc(t.ret)+'</span>';
  h += '<div class="handling">'+esc(t.handling)+'</div>';
  if (t.ingredienser && t.ingredienser.length){
    const brugt = S.ingr[t.id] || {};
    h += '<div class="ingr"><b>Til dette trin</b>' + t.ingredienser.map((navn,i) =>
      '<div class="irk'+(brugt[i]?' brugt':'')+'" data-i="'+i+'"><span class="ibox">'+(brugt[i]?'✓':'')+'</span><span>'+esc(navn)+'</span></div>').join('') + '</div>';
  }
  if (t.kendetegn) h += '<div class="blok kende"><b>Sådan ved du det er tid</b>'+esc(t.kendetegn)+'</div>';
  if (t.fejlkilde) h += '<div class="blok fejl"><b>Fejlkilde'+(t.fejlkilde.kan_reddes===false?' - kan ikke reddes':t.fejlkilde.kan_reddes===true?' - kan reddes':'')+'</b>'+esc(t.fejlkilde.tekst)+'</div>';
  if (t.uddyb) h += '<details class="uddyb"><summary>Uddyb</summary><div class="utekst">'+esc(t.uddyb)+'</div></details>';
  if (t.timer_min){
    h += '<div class="timer"><span class="tid" id="tid">'+fmt(t.timer_min*60000)+'</span><button class="big" id="timerknap">Start '+t.timer_min+' min</button></div>';
    // Kan visningen ikke sende notifikationer (iPhone-fane, indlejret visning), så sig det én gang, kort.
    if (!('Notification' in window))
      h += '<p class="note">Denne visning kan ikke sende besked når timeren er færdig - hold siden åben, så ringer og vibrerer den.</p>';
  }
  h += '</div>';
  el.innerHTML = h;

  const pos = document.getElementById('pos');
  pos.textContent = (S.trin+1)+' / '+trin.length;
  document.getElementById('forrige').disabled = S.trin===0;
  document.getElementById('naeste').textContent = S.trin===trin.length-1 ? 'Færdig ✓' : 'Næste ›';
  document.getElementById('naeste').classList.toggle('done', S.trin===trin.length-1);

  const tl = document.getElementById('tidslinje');
  // hop fra tidslinjen klapper den sammen - man har valgt sit trin og vil se kortet.
  // Luk i DOM'en før re-render: næste render læser åben-tilstanden derfra.
  tl.querySelectorAll('.tl-raekke').forEach(r => r.onclick = () => { tl.open = false; S.trin = +r.dataset.i; gem(); renderMadlavning(); });
  el.querySelectorAll('.irk').forEach(r => r.onclick = () => {
    const b = S.ingr[t.id] || (S.ingr[t.id] = {});
    const i = r.dataset.i;
    if (b[i]) delete b[i]; else b[i] = true;
    gem(); renderMadlavning();
  });
  const tk = document.getElementById('timerknap');
  if (tk) tk.onclick = () => {
    if (S.timere[t.id]) { delete S.timere[t.id]; toast('Timer stoppet'); }
    else { S.timere[t.id] = Date.now() + t.timer_min*60000; toast('Timer startet'); bedOmNotifikation(); }
    gem(); tick();
  };
  swipe(document.getElementById('kort'));
  tick();
}
function gaa(d){ S.trin = Math.max(0, Math.min(trin.length-1, S.trin+d)); gem(); renderMadlavning(); }
document.getElementById('forrige').onclick = () => gaa(-1);
document.getElementById('naeste').onclick = () => { if (S.trin===trin.length-1) toast('Maden er på bordet. Godt gået.'); else gaa(1); };
function swipe(el){
  let x0=null, y0=null;
  el.addEventListener('touchstart', e => { x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if (x0===null) return;
    const dx = e.changedTouches[0].clientX-x0, dy = e.changedTouches[0].clientY-y0;
    x0=y0=null;
    if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) gaa(dx<0?1:-1);
  }, {passive:true});
}
document.addEventListener('keydown', e => { if (S.fane!=='madlavning') return; if (e.key==='ArrowRight') gaa(1); if (e.key==='ArrowLeft') gaa(-1); });

// ---------- timere ----------
const ringet = {};
function tick(){
  const now = Date.now();
  const st = document.getElementById('status');
  if (st){
    st.innerHTML = Object.keys(S.timere).map(id => {
      const t = trin.find(x=>x.id===id); if (!t) return '';
      const rest = S.timere[id]-now;
      return '<span class="chip'+(rest<=0?' done':'')+'" data-id="'+esc(id)+'"><span class="dot" style="background:'+retFarve(t.ret)+'"></span>'+esc(t.titel)+' <span class="ct">'+(rest<=0?'FÆRDIG':fmt(rest))+'</span></span>';
    }).join('');
    st.querySelectorAll('.chip').forEach(c => c.onclick = () => { const i = trin.findIndex(x=>x.id===c.dataset.id); if (i>=0){ S.trin=i; gem(); renderMadlavning(); } });
  }
  const t = trin[S.trin], tidEl = document.getElementById('tid'), tk = document.getElementById('timerknap');
  if (t && tidEl){
    if (S.timere[t.id]){
      const rest = S.timere[t.id]-now;
      tidEl.textContent = fmt(rest); tidEl.classList.toggle('done', rest<=0);
      tk.textContent = rest<=0 ? 'Nulstil' : 'Stop';
    } else { tidEl.textContent = fmt(t.timer_min*60000); tidEl.classList.remove('done'); tk.textContent = 'Start '+t.timer_min+' min'; }
  }
  Object.keys(S.timere).forEach(id => { if (S.timere[id]-now<=0 && !ringet[id]) { ringet[id]=true; ring(); notifikation(id); } });
}
// ---------- notifikationer ----------
// Browserens egne notifikationer: virker når fanen er i baggrunden eller telefonen viser noget andet.
// Kan IKKE vække en helt lukket side, og på iPhone kun når siden er lagt på hjemmeskærmen.
function bedOmNotifikation(){
  if (!('Notification' in window) || Notification.permission!=='default') return;
  try { Notification.requestPermission().then(p => { if (p==='granted') toast('Du får besked når timeren er færdig'); }); } catch(e){}
}
function notifikation(id){
  if (!('Notification' in window) || Notification.permission!=='granted') return;
  const t = trin.find(x=>x.id===id); if (!t) return;
  try {
    const n = new Notification('Timer færdig: '+t.titel, { body: t.kendetegn || t.handling || '', tag: 'sous-chef-'+id, renotify: true, vibrate: [300,150,300] });
    n.onclick = () => { window.focus(); const i=trin.findIndex(x=>x.id===id); if(i>=0){ S.trin=i; gem(); visFane('madlavning'); } n.close(); };
  } catch(e){}
}
setInterval(tick, 500);
function ring(){
  try { if (navigator.vibrate) navigator.vibrate([300,150,300,150,600]); } catch(e){}
  try {
    const C = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(off => { const o=C.createOscillator(), g=C.createGain(); o.connect(g); g.connect(C.destination); o.frequency.value=880; g.gain.setValueAtTime(0.0001,C.currentTime+off); g.gain.exponentialRampToValueAtTime(0.4,C.currentTime+off+0.02); g.gain.exponentialRampToValueAtTime(0.0001,C.currentTime+off+0.3); o.start(C.currentTime+off); o.stop(C.currentTime+off+0.32); });
  } catch(e){}
}
// unlock lyd på første tryk (mobil kræver en brugerhandling)
document.addEventListener('touchstart', function unlock(){ try{ const C=new (window.AudioContext||window.webkitAudioContext)(); C.resume(); }catch(e){} document.removeEventListener('touchstart', unlock); }, {once:true, passive:true});

// #indkoeb / #madlavning i URL'en åbner direkte på den fane (deep-link + preview-kort)
const hashFane = (location.hash||'').slice(1);
visFane(faner.includes(hashFane) ? hashFane : S.fane);
})();
</script>
